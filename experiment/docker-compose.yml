services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: valuation
      POSTGRES_USER: valuation
      POSTGRES_PASSWORD: valuation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      # Explicit so compose doesn't depend on whether these are uncommented
      # in .env (which defaults to the no-Docker sqlite/localhost setup).
      DATABASE_URL: postgres://valuation:valuation@db:5432/valuation
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    ports:
      # Host port is configurable so it can run beside a local `runserver`
      # on 8000, e.g. DOCKER_API_PORT=8001 docker compose up.
      - "${DOCKER_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      # Explicit so compose doesn't depend on whether these are uncommented
      # in .env (which defaults to the no-Docker sqlite/localhost setup).
      DATABASE_URL: postgres://valuation:valuation@db:5432/valuation
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./web
    command: npm run dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./web/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
